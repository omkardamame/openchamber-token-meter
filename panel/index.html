<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Token meter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        color: var(--oc-fg);
        background: transparent;
        font-family: var(--oc-font);
        font-size: 12.5px;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .notice:empty {
        display: none;
      }
      .notice:not(:empty) {
        padding: 12px 12px 0;
      }
      .meter {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 14px 14px 18px;
        box-sizing: border-box;
        height: 100%;
        overflow-y: auto;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .eyebrow {
        min-width: 0;
        overflow: hidden;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--oc-muted);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: none;
        font-size: 12px;
        color: var(--oc-muted);
        white-space: nowrap;
      }
      /* The dot and its halo. The halo is a round gradient hung off the dot, not
         a box-shadow: a shadow cast by a 7px box is a blurred rounded square,
         and at this size the corners read square. The gradient is round at every
         size and fades like light. It carries the state colour; the core pulses
         inside it, and both breathe on the same clock. */
      .dot {
        position: relative;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--oc-muted);
        flex: none;
      }
      .dot::before {
        content: '';
        position: absolute;
        inset: -7px;
        border-radius: 50%;
        background: radial-gradient(
          circle closest-side,
          transparent 0%,
          color-mix(in srgb, var(--dot-glow, transparent) 30%, transparent) 26%,
          color-mix(in srgb, var(--dot-glow, transparent) 58%, transparent) 36%,
          color-mix(in srgb, var(--dot-glow, transparent) 16%, transparent) 58%,
          transparent 95%
        );
        opacity: 0;
        /* A state change drops the animation; this fades the halo out instead
           of blinking it away. */
        transition: opacity 220ms ease, transform 220ms ease;
        pointer-events: none;
      }
      /* Dim at rest: no glow, nothing moving. */
      .dot[data-state='idle'],
      .dot:not([data-state]) {
        background: var(--oc-muted);
        opacity: 0.45;
        animation: none;
      }
      /* Tokens arriving: a slow breathing glow in the success colour. */
      .dot[data-state='streaming'] {
        --dot-glow: var(--oc-success);
        background: var(--oc-success);
        animation: breathe 2.4s ease-in-out infinite;
      }
      .dot[data-state='streaming']::before {
        animation: halo-breathe 2.4s ease-in-out infinite;
      }
      /* A turn is running without the model: a sharper, uneven orange glow. */
      .dot[data-state='tool'],
      .dot[data-state='waiting'] {
        --dot-glow: var(--oc-warning);
        background: var(--oc-warning);
        animation: break-glow 1.1s cubic-bezier(0.2, 0.9, 0.1, 1) infinite;
      }
      .dot[data-state='tool']::before,
      .dot[data-state='waiting']::before {
        animation: halo-break 1.1s cubic-bezier(0.2, 0.9, 0.1, 1) infinite;
      }
      .dot[data-state='error'] {
        background: var(--oc-error);
        opacity: 0.8;
        animation: none;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes halo-breathe {
        0%,
        100% {
          opacity: 0.18;
          transform: scale(0.82);
        }
        50% {
          opacity: 0.95;
          transform: scale(1.12);
        }
      }
      @keyframes break-glow {
        0% {
          opacity: 0.45;
        }
        40% {
          opacity: 1;
        }
        55% {
          opacity: 0.55;
        }
        75% {
          opacity: 0.95;
        }
      }
      @keyframes halo-break {
        0% {
          opacity: 0.12;
          transform: scale(0.8);
        }
        40% {
          opacity: 0.95;
          transform: scale(1.08);
        }
        55% {
          opacity: 0.28;
          transform: scale(0.88);
        }
        75% {
          opacity: 0.85;
          transform: scale(1.02);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot,
        .dot::before {
          animation: none !important;
        }
      }
      .live {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: none;
      }
      .speed {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .stat-label {
        display: inline-flex;
        align-items: baseline;
        gap: 5px;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--oc-muted);
      }
      .stat-label em {
        font-style: normal;
        text-transform: none;
        letter-spacing: 0.01em;
        opacity: 0.7;
      }
      .speed-value {
        display: inline-flex;
        align-items: baseline;
        gap: 5px;
      }
      .speed-value b {
        font-size: 42px;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        transition: color 250ms ease, text-shadow 250ms ease;
      }
      /* The rate's colour is its tier: slow matte red, steady green, fast sky
         blue, blazing golden, ultra violet. The top two glow softly; the hexes
         are fixed so a rate reads the same in every theme. It colours the live
         headline and the last measured step alike. */
      .meter [data-tier='slow'] {
        color: #c96a6a;
      }
      .meter [data-tier='steady'] {
        color: #76ac4f;
      }
      .meter [data-tier='fast'] {
        color: #3b82f6;
      }
      .meter [data-tier='blazing'] {
        color: #d4af37;
        text-shadow: 0 0 8px #d4af3773;
      }
      .meter [data-tier='ultra'] {
        color: #a855f7;
        text-shadow: 0 0 8px #a855f773;
      }
      .speed-value i {
        font-style: normal;
        font-size: 14.5px;
        color: var(--oc-muted);
      }
      .speed-value b.quiet {
        color: var(--oc-muted);
        opacity: 0.75;
        text-shadow: none;
      }
      .speed-note,
      .speed-last {
        font-size: 11.5px;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
        line-height: 1.45;
      }
      .speed-last {
        opacity: 0.9;
      }
      .last-rate {
        transition: color 250ms ease, text-shadow 250ms ease;
      }
      .chart {
        width: 100%;
        height: auto;
        display: block;
      }
      .chart-wrap {
        position: relative;
        margin-top: 8px;
      }
      .live .chart-wrap {
        height: 200px;
      }
      .chart-wrap .chart {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .axis {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--oc-muted);
        opacity: 0.85;
        font-variant-numeric: tabular-nums;
      }
      .block {
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-top: 1px solid var(--oc-border);
        padding-top: 12px;
        flex: none;
      }
      .block-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--oc-fg);
      }
      .block-meta {
        font-size: 11.5px;
        font-weight: 400;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .subagents[hidden],
      .legend[hidden] {
        display: none;
      }
      .subs-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sub-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .sub-title {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        font-size: 12px;
        color: var(--oc-fg);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sub-rate {
        flex: none;
        font-size: 11.5px;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
      }
      .sub-more {
        padding-left: 15px;
        font-size: 11px;
        color: var(--oc-muted);
      }
      .legend {
        display: flex;
        gap: 12px;
        font-size: 11px;
        color: var(--oc-muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .swatch {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
      }
      .swatch.main {
        background: var(--oc-primary);
      }
      .swatch.sub {
        background: var(--oc-info);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 14px;
        row-gap: 10px;
      }
      .cell {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .cell-label {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--oc-muted);
      }
      .cell-value {
        font-size: 17.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.25;
      }
      .cell-share {
        font-style: normal;
        font-size: 11px;
        font-weight: 400;
        color: var(--oc-muted);
        margin-left: 5px;
      }
      .cell-top {
        border-top: 1px solid var(--oc-border);
        padding-top: 8px;
      }
      .steps-avg {
        color: var(--oc-success);
      }
      .steps-peak {
        color: var(--oc-error);
      }
      .steps-avg:not(:empty)::before,
      .steps-peak:not(:empty)::before {
        content: "·";
        margin: 0 6px;
        color: var(--oc-muted);
      }
      .steps-axis {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
      }
      .steps-axis[hidden] {
        display: none;
      }
      .block.steps .block-head .block-meta {
        white-space: normal;
        text-align: right;
      }
      .cost-grid .cost-model {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cost-rates {
        font-size: 11.5px;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
      }
      .block.steps {
        flex: 1 1 auto;
        min-height: 140px;
      }
      .block.steps .chart-wrap {
        flex: 1 1 auto;
        min-height: 110px;
        margin-top: 0;
      }
      .foot {
        font-size: 11.5px;
        color: var(--oc-muted);
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
