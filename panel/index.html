<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Token meter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        color: var(--oc-fg);
        background: transparent;
        font-family: var(--oc-font);
        font-size: 12.5px;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .notice:empty {
        display: none;
      }
      .notice:not(:empty) {
        padding: 12px 12px 0;
      }
      .meter {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 14px 14px 18px;
        box-sizing: border-box;
        height: 100%;
        overflow-y: auto;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .eyebrow {
        min-width: 0;
        overflow: hidden;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--oc-muted);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: none;
        font-size: 12px;
        color: var(--oc-muted);
        white-space: nowrap;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--oc-muted);
        flex: none;
      }
      /* Dim at rest: no glow, nothing moving. */
      .dot[data-state='idle'],
      .dot:not([data-state]) {
        background: var(--oc-muted);
        opacity: 0.45;
        box-shadow: none;
        animation: none;
      }
      /* Tokens arriving: a slow breathing glow in the success colour. */
      .dot[data-state='streaming'] {
        background: var(--oc-success);
        animation: breathe 2.4s ease-in-out infinite;
      }
      /* A turn is running without the model: a sharper, uneven orange glow. */
      .dot[data-state='tool'],
      .dot[data-state='waiting'] {
        background: var(--oc-warning);
        animation: break-glow 1.1s cubic-bezier(0.2, 0.9, 0.1, 1) infinite;
      }
      .dot[data-state='error'] {
        background: var(--oc-error);
        opacity: 0.8;
        box-shadow: none;
        animation: none;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
          box-shadow: 0 0 0 0 transparent;
        }
        50% {
          opacity: 1;
          box-shadow: 0 0 7px 2px color-mix(in srgb, var(--oc-success) 55%, transparent);
        }
      }
      @keyframes break-glow {
        0% {
          opacity: 0.45;
          box-shadow: 0 0 2px 0 color-mix(in srgb, var(--oc-warning) 30%, transparent);
        }
        40% {
          opacity: 1;
          box-shadow: 0 0 8px 2px color-mix(in srgb, var(--oc-warning) 65%, transparent);
        }
        55% {
          opacity: 0.55;
          box-shadow: 0 0 3px 1px color-mix(in srgb, var(--oc-warning) 35%, transparent);
        }
        75% {
          opacity: 0.95;
          box-shadow: 0 0 6px 2px color-mix(in srgb, var(--oc-warning) 55%, transparent);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none !important;
          box-shadow: none !important;
        }
      }
      .live {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: none;
      }
      .speed {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .stat-label {
        display: inline-flex;
        align-items: baseline;
        gap: 5px;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--oc-muted);
      }
      .stat-label em {
        font-style: normal;
        text-transform: none;
        letter-spacing: 0.01em;
        opacity: 0.7;
      }
      .speed-value {
        display: inline-flex;
        align-items: baseline;
        gap: 5px;
      }
      .speed-value b {
        font-size: 42px;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .speed-value i {
        font-style: normal;
        font-size: 14.5px;
        color: var(--oc-muted);
      }
      .speed-value b.quiet {
        color: var(--oc-muted);
        opacity: 0.75;
      }
      .speed-note,
      .speed-last {
        font-size: 11.5px;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
        line-height: 1.45;
      }
      .speed-last {
        opacity: 0.9;
      }
      .chart {
        width: 100%;
        height: auto;
        display: block;
      }
      .chart-wrap {
        position: relative;
        margin-top: 8px;
      }
      .live .chart-wrap {
        height: 200px;
      }
      .chart-wrap .chart {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .axis {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--oc-muted);
        opacity: 0.85;
        font-variant-numeric: tabular-nums;
      }
      .block {
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-top: 1px solid var(--oc-border);
        padding-top: 12px;
        flex: none;
      }
      .block-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--oc-fg);
      }
      .block-meta {
        font-size: 11.5px;
        font-weight: 400;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .subagents[hidden],
      .legend[hidden] {
        display: none;
      }
      .subs-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sub-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .sub-title {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        font-size: 12px;
        color: var(--oc-fg);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sub-rate {
        flex: none;
        font-size: 11.5px;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
      }
      .sub-more {
        padding-left: 15px;
        font-size: 11px;
        color: var(--oc-muted);
      }
      .legend {
        display: flex;
        gap: 12px;
        font-size: 11px;
        color: var(--oc-muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .swatch {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
      }
      .swatch.main {
        background: var(--oc-primary);
      }
      .swatch.sub {
        background: var(--oc-info);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 14px;
        row-gap: 10px;
      }
      .cell {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .cell-label {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--oc-muted);
      }
      .cell-value {
        font-size: 17.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.25;
      }
      .cell-share {
        font-style: normal;
        font-size: 11px;
        font-weight: 400;
        color: var(--oc-muted);
        margin-left: 5px;
      }
      .cell-top {
        border-top: 1px solid var(--oc-border);
        padding-top: 8px;
      }
      .steps-avg {
        color: var(--oc-success);
      }
      .steps-peak {
        color: var(--oc-error);
      }
      .steps-avg:not(:empty)::before,
      .steps-peak:not(:empty)::before {
        content: "·";
        margin: 0 6px;
        color: var(--oc-muted);
      }
      .steps-axis {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
      }
      .steps-axis[hidden] {
        display: none;
      }
      .block.steps .block-head .block-meta {
        white-space: normal;
        text-align: right;
      }
      .cost-grid .cost-model {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cost-rates {
        font-size: 11.5px;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
      }
      .block.steps {
        flex: 1 1 auto;
        min-height: 140px;
      }
      .block.steps .chart-wrap {
        flex: 1 1 auto;
        min-height: 110px;
        margin-top: 0;
      }
      .foot {
        font-size: 11.5px;
        color: var(--oc-muted);
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
