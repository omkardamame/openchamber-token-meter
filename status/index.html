<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Token meter</title>
    <style>
      /* This page reports its own height, so nothing here may be sized by the
         frame: a 100%-tall root makes scrollHeight grow with every setHeight
         and the section creeps down the panel forever. */
      html,
      body {
        margin: 0;
      }
      body {
        color: var(--oc-fg);
        background: transparent;
        font-family: var(--oc-font);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      .notice:not(:empty) {
        padding: 0 0 6px;
      }
      .mini {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 2px 2px 0;
        box-sizing: border-box;
      }
      .line {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--oc-muted);
        flex: none;
        align-self: center;
      }
      /* Dim at rest: no glow, nothing moving. */
      .dot[data-state='idle'],
      .dot:not([data-state]) {
        background: var(--oc-muted);
        opacity: 0.45;
        box-shadow: none;
        animation: none;
      }
      /* Tokens arriving: a slow breathing glow in the success colour. */
      .dot[data-state='streaming'] {
        background: var(--oc-success);
        animation: breathe 2.4s ease-in-out infinite;
      }
      /* A turn is running without the model: a sharper, uneven orange glow. */
      .dot[data-state='tool'],
      .dot[data-state='waiting'] {
        background: var(--oc-warning);
        animation: break-glow 1.1s cubic-bezier(0.2, 0.9, 0.1, 1) infinite;
      }
      .dot[data-state='error'] {
        background: var(--oc-error);
        opacity: 0.8;
        box-shadow: none;
        animation: none;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
          box-shadow: 0 0 0 0 transparent;
        }
        50% {
          opacity: 1;
          box-shadow: 0 0 7px 2px color-mix(in srgb, var(--oc-success) 55%, transparent);
        }
      }
      @keyframes break-glow {
        0% {
          opacity: 0.45;
          box-shadow: 0 0 2px 0 color-mix(in srgb, var(--oc-warning) 30%, transparent);
        }
        40% {
          opacity: 1;
          box-shadow: 0 0 8px 2px color-mix(in srgb, var(--oc-warning) 65%, transparent);
        }
        55% {
          opacity: 0.55;
          box-shadow: 0 0 3px 1px color-mix(in srgb, var(--oc-warning) 35%, transparent);
        }
        75% {
          opacity: 0.95;
          box-shadow: 0 0 6px 2px color-mix(in srgb, var(--oc-warning) 55%, transparent);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none !important;
          box-shadow: none !important;
        }
      }
      .speed {
        display: flex;
        flex-direction: column;
        gap: 1px;
        flex: none;
        min-width: 96px;
      }
      .speed-value {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
      }
      .tps {
        font-size: 22px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .tps.quiet {
        color: var(--oc-muted);
        opacity: 0.75;
      }
      .unit {
        font-size: 11.5px;
        color: var(--oc-muted);
      }
      .last {
        font-size: 11px;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .last.rate {
        color: var(--oc-warning);
      }
      .spark {
        flex: 1 1 auto;
        min-width: 40px;
        height: 30px;
        display: block;
        align-self: center;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 12px;
        row-gap: 6px;
      }
      .cell {
        display: flex;
        flex-direction: column;
        gap: 0;
        min-width: 0;
      }
      .cell-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--oc-muted);
      }
      .cell-value {
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.25;
      }
      .cell-top {
        border-top: 1px solid var(--oc-border);
        padding-top: 6px;
      }
      .cell-share {
        font-style: normal;
        font-size: 10.5px;
        font-weight: 400;
        color: var(--oc-muted);
        margin-left: 4px;
      }
      .foot {
        font-size: 11px;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
      }
      .foot:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
