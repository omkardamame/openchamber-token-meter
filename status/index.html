<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Token meter</title>
    <style>
      /* This page reports its own height, so nothing here may be sized by the
         frame: a 100%-tall root makes scrollHeight grow with every setHeight
         and the section creeps down the panel forever. */
      html,
      body {
        margin: 0;
      }
      body {
        color: var(--oc-fg);
        background: transparent;
        font-family: var(--oc-font);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      .notice:not(:empty) {
        padding: 0 0 6px 10px;
      }
      .mini {
        display: flex;
        flex-direction: column;
        gap: 8px;
        /* Left room for the dot's 7px halo: the host clips this frame's box, so
           a glow drawn past the edge is cut off square. */
        padding: 2px 2px 0 10px;
        box-sizing: border-box;
      }
      .line {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      /* The dot and its halo. The halo is a round gradient hung off the dot, not
         a box-shadow: a shadow cast by a 7px box is a blurred rounded square,
         and at this size the corners read square. The gradient is round at every
         size and fades like light. It carries the state colour; the core pulses
         inside it, and both breathe on the same clock. The halo reaches 7px, so
         the frame keeps that much room on its left instead of cutting it off. */
      .dot {
        position: relative;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--oc-muted);
        flex: none;
        align-self: center;
      }
      .dot::before {
        content: '';
        position: absolute;
        inset: -7px;
        border-radius: 50%;
        background: radial-gradient(
          circle closest-side,
          transparent 0%,
          color-mix(in srgb, var(--dot-glow, transparent) 30%, transparent) 26%,
          color-mix(in srgb, var(--dot-glow, transparent) 58%, transparent) 36%,
          color-mix(in srgb, var(--dot-glow, transparent) 16%, transparent) 58%,
          transparent 95%
        );
        opacity: 0;
        /* A state change drops the animation; this fades the halo out instead
           of blinking it away. */
        transition: opacity 220ms ease, transform 220ms ease;
        pointer-events: none;
      }
      /* Dim at rest: no glow, nothing moving. */
      .dot[data-state='idle'],
      .dot:not([data-state]) {
        background: var(--oc-muted);
        opacity: 0.45;
        animation: none;
      }
      /* Tokens arriving: a slow breathing glow in the success colour. */
      .dot[data-state='streaming'] {
        --dot-glow: var(--oc-success);
        background: var(--oc-success);
        animation: breathe 2.4s ease-in-out infinite;
      }
      .dot[data-state='streaming']::before {
        animation: halo-breathe 2.4s ease-in-out infinite;
      }
      /* A turn is running without the model: a sharper, uneven orange glow. */
      .dot[data-state='tool'],
      .dot[data-state='waiting'] {
        --dot-glow: var(--oc-warning);
        background: var(--oc-warning);
        animation: break-glow 1.1s cubic-bezier(0.2, 0.9, 0.1, 1) infinite;
      }
      .dot[data-state='tool']::before,
      .dot[data-state='waiting']::before {
        animation: halo-break 1.1s cubic-bezier(0.2, 0.9, 0.1, 1) infinite;
      }
      .dot[data-state='error'] {
        background: var(--oc-error);
        opacity: 0.8;
        animation: none;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes halo-breathe {
        0%,
        100% {
          opacity: 0.18;
          transform: scale(0.82);
        }
        50% {
          opacity: 0.95;
          transform: scale(1.12);
        }
      }
      @keyframes break-glow {
        0% {
          opacity: 0.45;
        }
        40% {
          opacity: 1;
        }
        55% {
          opacity: 0.55;
        }
        75% {
          opacity: 0.95;
        }
      }
      @keyframes halo-break {
        0% {
          opacity: 0.12;
          transform: scale(0.8);
        }
        40% {
          opacity: 0.95;
          transform: scale(1.08);
        }
        55% {
          opacity: 0.28;
          transform: scale(0.88);
        }
        75% {
          opacity: 0.85;
          transform: scale(1.02);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot,
        .dot::before {
          animation: none !important;
        }
      }
      .speed {
        display: flex;
        flex-direction: column;
        gap: 1px;
        flex: none;
        min-width: 96px;
      }
      .speed-value {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
      }
      .tps {
        font-size: 22px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
        transition: color 250ms ease, text-shadow 250ms ease;
      }
      /* The rate's colour is its tier: slow matte red, steady green, fast sky
         blue, blazing golden, ultra violet. The top two glow softly; the hexes
         are fixed so a rate reads the same in every theme. It colours the live
         headline and the last measured step alike. */
      .mini [data-tier='slow'] {
        color: #c96a6a;
      }
      .mini [data-tier='steady'] {
        color: #76ac4f;
      }
      .mini [data-tier='fast'] {
        color: #3b82f6;
      }
      .mini [data-tier='blazing'] {
        color: #d4af37;
        text-shadow: 0 0 8px #d4af3773;
      }
      .mini [data-tier='ultra'] {
        color: #a855f7;
        text-shadow: 0 0 8px #a855f773;
      }
      .tps.quiet {
        color: var(--oc-muted);
        opacity: 0.75;
        text-shadow: none;
      }
      .unit {
        font-size: 11.5px;
        color: var(--oc-muted);
      }
      .last {
        font-size: 11px;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .last-rate {
        transition: color 250ms ease, text-shadow 250ms ease;
      }
      .spark {
        flex: 1 1 auto;
        min-width: 40px;
        height: 30px;
        display: block;
        align-self: center;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 12px;
        row-gap: 6px;
      }
      .cell {
        display: flex;
        flex-direction: column;
        gap: 0;
        min-width: 0;
      }
      .cell-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--oc-muted);
      }
      .cell-value {
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.25;
      }
      .cell-top {
        border-top: 1px solid var(--oc-border);
        padding-top: 6px;
      }
      .cell-share {
        font-style: normal;
        font-size: 10.5px;
        font-weight: 400;
        color: var(--oc-muted);
        margin-left: 4px;
      }
      .foot {
        font-size: 11px;
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
      }
      .foot:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
